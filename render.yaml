services:
  # Main ACT-R web interface
  - type: web
    name: act-r-main
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 4000
    disk:
      name: act-r-data
      mountPath: /home/actr/actr7.x/tutorial
      sizeGB: 1
  
  # Note: Render free tier supports only one service
  # For Jupyter (port 8888) and ACT-R remote (port 2650), 
  # upgrade to paid plan and add additional services:
  
  # - type: web
  #   name: act-r-jupyter
  #   env: docker
  #   dockerfilePath: ./Dockerfile
  #   dockerContext: .
  #   plan: starter
  #   startCommand: "/start-it.sh run-jupyter.sh"
  #   envVars:
  #     - key: PORT
  #       value: 8888